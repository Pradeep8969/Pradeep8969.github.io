<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Teddy Day 🧸</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #2b1b3f, #12071d);
  overflow: hidden;
  color: white;
}

/* Floating teddies */
.teddy-float {
  position: absolute;
  font-size: 28px;
  animation: float 12s linear infinite;
  opacity: 0.6;
}
@keyframes float {
  from { transform: translateY(110vh); }
  to { transform: translateY(-10vh); }
}

/* Heartbeat */
.heartbeat {
  animation: beat 1.4s infinite;
}
@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

/* Message card */
.message-card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 14px;
  max-width: 260px;
  margin: auto;
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen">

<!-- Music -->
<audio id="bgMusic" src="lovei.mp3" autoplay loop muted></audio>

<!-- Floating background -->
<div id="floatWrap"></div>

<!-- Main -->
<div class="relative z-10 text-center max-w-sm">

  <h1 class="text-3xl font-semibold mb-4">Happy Teddy Day 🧸</h1>

  <!-- Teddy holding message -->
  <div class="relative heartbeat">
    <img src="teddy.png" alt="Teddy" class="w-64 mx-auto">

    <!-- Message on teddy -->
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 message-card text-sm text-pink-100">
      <span id="typingMessage"></span>
    </div>
  </div>

  <button onclick="startLove()" 
    class="mt-6 px-6 py-3 bg-pink-600 hover:bg-pink-700 rounded-full transition">
    Hug the Teddy 🤗
  </button>

  <p id="extraMessage" class="mt-4 text-pink-300 hidden text-sm">
    Hey, even if i cant be there to hug you this panda carries all my hugs for you 🧸💞
  </p>
</div>

<script>
// Floating emojis
for (let i = 0; i < 20; i++) {
  const t = document.createElement('div');
  t.className = 'teddy-float';
  t.innerText = '🧸';
  t.style.left = Math.random() * 100 + 'vw';
  t.style.animationDuration = (8 + Math.random() * 6) + 's';
  document.getElementById('floatWrap').appendChild(t);
}

// Typing message
const message = "Hey darling, if I could give you one thing today it would be a cute little panda teddy that will hug you whenever I can’t. Happy Teddy Day 🧸❤️";
const typingElement = document.getElementById("typingMessage");
let index = 0;

function typeMessage() {
  if (index < message.length) {
    typingElement.innerHTML += message.charAt(index);
    index++;
    setTimeout(typeMessage, 45);
  }
}
window.addEventListener('load', typeMessage);

// Interaction
function startLove() {
  document.getElementById('extraMessage').classList.remove('hidden');

  const music = document.getElementById('bgMusic');
  music.muted = false;
  music.play();

  if (navigator.vibrate) {
    navigator.vibrate([200, 100, 200]);
  }
}
</script>

</body>
</html>
