<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Hug Day 🤗</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
body{
  font-family: 'Playfair Display', serif;
  background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
}

/* Fade animation */
.fade{
  opacity:0;
  transform:translateY(20px);
  transition:all 1s ease;
}
.fade.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

<!-- Background Music -->
<audio id="bgMusic" src="lovei.mp3" autoplay loop muted playsinline></audio>

<div class="bg-white/70 backdrop-blur-md rounded-3xl shadow-xl max-w-md w-full p-6 text-center">

  <h1 class="text-3xl text-pink-600 mb-4">Happy Hug Day 🤗</h1>

  <p class="text-lg text-gray-700 mb-6">
    For my <span class="text-pink-600 font-semibold">Subina cute gf</span> ❤️
  </p>

  <!-- Photo Section -->
  <div class="grid grid-cols-2 gap-3 mb-6">
    <!-- Replace photo1.jpg etc with your real images -->
    <img src="photo1.jpg" class="rounded-xl shadow-md hover:scale-105 transition duration-300">
    <img src="photo2.jpg" class="rounded-xl shadow-md hover:scale-105 transition duration-300">
    <img src="photo3.jpg" class="rounded-xl shadow-md hover:scale-105 transition duration-300">
    <img src="photo4.jpg" class="rounded-xl shadow-md hover:scale-105 transition duration-300">
  </div>

  <button onclick="showMessage()" 
    class="px-6 py-3 bg-pink-500 hover:bg-pink-600 text-white rounded-full transition duration-300">
    Open My Hug 🤍
  </button>

  <!-- Message -->
  <div id="messageBox" class="mt-6 space-y-3 text-gray-700 hidden">

    <p class="fade">Today, I just wish I could hold you close.</p>
    <p class="fade">Not to fix everything instantly,</p>
    <p class="fade">but to remind you that I am still here.</p>
    <p class="fade">And in that hug, you would feel how much you mean to me.</p>

  </div>

</div>

<script>

/* Reveal Message */
function showMessage(){
  const box=document.getElementById("messageBox");
  box.classList.remove("hidden");

  const fades=document.querySelectorAll(".fade");
  fades.forEach((el,index)=>{
    setTimeout(()=>{
      el.classList.add("show");
    },index*700);
  });

  const music=document.getElementById("bgMusic");
  music.muted=false;
  music.play();

  if(navigator.vibrate){
    navigator.vibrate([200,100,200]);
  }
}

/* Autoplay workaround */
document.addEventListener("click",()=>{
  const music=document.getElementById("bgMusic");
  music.muted=false;
  music.play();
},{once:true});

</script>

</body>
</html>
