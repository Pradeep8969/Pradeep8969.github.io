<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Chocolate Day 🍫</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #3b1d1d, #120707);
  overflow: hidden;
  color: white;
}

/* Floating chocolates */
.choco {
  position: absolute;
  width: 30px;
  height: 30px;
  background: #5c2c1b;
  border-radius: 6px;
  animation: float 12s linear infinite;
  opacity: 0.6;
}
@keyframes float {
  from { transform: translateY(110vh) rotate(0deg); }
  to { transform: translateY(-10vh) rotate(360deg); }
}

/* Heartbeat */
.heartbeat {
  animation: beat 1.5s infinite;
}
@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

/* Typing effect */
@keyframes typing {
  from { width: 0; }
  to { width: 100%; }
}
@keyframes blink {
  50% { border-color: transparent; }
}
.typing-text {
  display: inline-block;
  overflow: hidden;
  border-right: 2px solid #ffb6b9;
  white-space: nowrap;
  width: 0;
  animation: typing 4s steps(50, end) forwards, blink 0.75s step-end infinite;
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen text-white">

<!-- Background Music -->
<audio id="bgMusic" src="love.mp3" autoplay loop muted></audio>

<!-- Floating Chocolates -->
<div id="chocoWrap"></div>

<!-- Main Card -->
<div class="relative z-10 bg-black/40 backdrop-blur-xl rounded-2xl p-8 text-center max-w-md shadow-2xl">
  <h1 class="text-4xl font-semibold mb-3">Happy Chocolate Day 🍫</h1>

  <p class="text-lg text-pink-200 mb-6">
    <span class="typing-text" id="typingMessage">
      Hey bae, just like chocolate, you make my life sweeter, warmer, and happier. Happy Chocolate Day to my sweetest girl🍫❤️
    </span>
  </p>

  <div class="text-6xl heartbeat mb-4">🍫❤️</div>

  <button onclick="startLove()" 
    class="px-6 py-3 bg-pink-600 hover:bg-pink-700 rounded-full transition">
    Tap for a sweet surprise 💝
  </button>

  <p id="extraMessage" class="mt-6 text-pink-300 hidden text-sm">
    Kanxo, you’re my favorite kind of sweetness 🍫💖
  </p>
</div>

<script>
/* Floating chocolates */
for (let i = 0; i < 25; i++) {
  const c = document.createElement('div');
  c.className = 'choco';
  c.style.left = Math.random() * 100 + 'vw';
  c.style.animationDuration = (8 + Math.random() * 6) + 's';
  c.style.opacity = Math.random();
  document.getElementById('chocoWrap').appendChild(c);
}

/* Start interaction */
function startLove() {
  // Reveal extra message
  document.getElementById('extraMessage').classList.remove('hidden');

  // Unmute music (mobile friendly)
  const music = document.getElementById('bgMusic');
  music.muted = false;
  music.play();

  // Vibration (mobile supported)
  if (navigator.vibrate) {
    navigator.vibrate([200, 100, 200]);
  }
}
</script>

</body>
</html>
