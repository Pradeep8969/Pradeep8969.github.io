<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propose Day 💍</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Cinzel:wght@600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Cormorant Garamond', serif;
    background: radial-gradient(circle at top, #7f1d1d, #450a0a);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Floating roses */
.rose {
    position: fixed;
    top: -10vh;
    animation: fall linear infinite;
    pointer-events: none;
    opacity: .9;
}
@keyframes fall {
    to { transform: translateY(120vh) rotate(360deg); }
}

/* Envelope */
.envelope {
    width: 320px;
    height: 200px;
    background: #fff7ed;
    position: relative;
    border-radius: 14px;
    box-shadow: 0 25px 60px rgba(0,0,0,.45);
    overflow: hidden;
}
.flap {
    position: absolute;
    top: 0;
    width: 100%;
    height: 100%;
    background: #fecaca;
    clip-path: polygon(0 0, 100% 0, 50% 60%);
    transform-origin: top;
    transition: transform 1s ease;
    z-index: 3;
}
.letter {
    position: absolute;
    bottom: -100%;
    left: 12px;
    right: 12px;
    background: #fff;
    border-radius: 12px;
    padding: 26px;
    text-align: center;
    transition: bottom 1.3s ease;
    box-shadow: inset 0 0 20px rgba(0,0,0,.08);
}

/* Active */
.envelope.open .flap { transform: rotateX(180deg); }
.envelope.open .letter { bottom: 10px; }

/* Text reveal */
.fade {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s forwards;
}
@keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<!-- 🎵 BACKGROUND MUSIC (AUTOPLAY MUTED) -->
<audio id="bgMusic" autoplay muted loop>
    <source src="music/proposal.mp3" type="audio/mpeg">
</audio>

<!-- Floating roses -->
<script>
for(let i=0;i<45;i++){
    const r=document.createElement('div');
    r.className='rose';
    r.textContent='🌹';
    r.style.left=Math.random()*100+'vw';
    r.style.fontSize=22+Math.random()*35+'px';
    r.style.animationDuration=8+Math.random()*12+'s';
    document.body.appendChild(r);
}
</script>

<div class="bg-white/90 backdrop-blur-xl rounded-3xl p-10 max-w-md w-full shadow-2xl text-center z-10">

    <h1 class="text-5xl font-black text-red-900 mb-2"
        style="font-family:'Playfair Display',serif;">
        Propose Day
    </h1>

    <p class="uppercase tracking-widest text-sm mb-6 text-red-700"
       style="font-family:'Cinzel',serif;">
        February 8
    </p>

    <input id="nameInput"
        placeholder="Type the secret name..."
        class="w-full py-4 px-6 rounded-2xl text-center border-2 border-red-300 focus:outline-none focus:border-red-600 text-lg mb-6"/>

    <button onclick="openEnvelope()"
        class="w-full py-4 rounded-2xl bg-gradient-to-r from-red-700 to-red-900
               text-white tracking-widest uppercase font-semibold
               hover:scale-105 transition">
        Open My Heart
    </button>

    <div class="mt-10 flex justify-center">
        <div id="envelope" class="envelope hidden">
            <div class="flap"></div>
            <div class="letter">
                <h2 class="text-3xl font-bold text-red-900 mb-4 fade"
                    style="animation-delay:.3s;">
                    Subina 💖
                </h2>

                <p class="text-lg text-red-800 leading-relaxed fade"
                   style="animation-delay:.6s;">
                    Every heartbeat of mine whispers your name.<br>
                    Loving you feels like destiny choosing me.
                </p>

                <p class="mt-4 text-lg text-red-800 fade"
                   style="animation-delay:.9s;">
                    I don’t promise perfection,<br>
                    but I promise <b>forever</b>.
                </p>

                <p class="mt-6 text-2xl font-semibold text-red-900 fade"
                   style="animation-delay:1.2s;">
                    Will you be mine? 💍
                </p>
            </div>
        </div>
    </div>
</div>

<script>
const SECRET = "subina";
let musicUnlocked = false;

function vibrateLove(){
    if(navigator.vibrate){
        navigator.vibrate([200,100,200,100,300]);
    }
}

function unlockMusic(){
    const music = document.getElementById("bgMusic");
    if(!musicUnlocked){
        music.muted = false;
        music.volume = 0;
        music.play().catch(()=>{});
        let v = 0;
        const fade = setInterval(()=>{
            if(v < 0.4){
                v += 0.02;
                music.volume = v;
            } else clearInterval(fade);
        }, 150);
        musicUnlocked = true;
    }
}

function openEnvelope(){
    unlockMusic();
    vibrateLove();

    const val = document.getElementById("nameInput").value.trim().toLowerCase();
    if(val === SECRET){
        const env = document.getElementById("envelope");
        env.classList.remove("hidden");
        setTimeout(()=>env.classList.add("open"),200);
    } else {
        alert("This letter belongs to only one heart 💔");
    }
}

// unlock music on any interaction (mobile safe)
document.addEventListener("click", unlockMusic, { once:true });
document.addEventListener("touchstart", unlockMusic, { once:true });
</script>

</body>
</html>
