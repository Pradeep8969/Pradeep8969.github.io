<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Subina 💍</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Cinzel:wght@600&display=swap" rel="stylesheet">

<style>
    body, html {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at top, #7f1d1d, #450a0a);
        /* Scroll is disabled until name is typed */
        overflow: hidden; 
        height: 100%;
    }

    /* Floating roses */
    .rose {
        position: fixed;
        top: -10vh;
        animation: fall linear infinite;
        pointer-events: none;
        z-index: 10;
        transition: opacity 1s ease;
    }
    @keyframes fall {
        to { transform: translateY(110vh) rotate(360deg); }
    }

    /* Envelope styling */
    .envelope-wrapper {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 320px;
        height: 200px;
        z-index: 20;
    }

    .envelope {
        position: relative;
        width: 100%;
        height: 100%;
        background: #fecaca;
        border-radius: 0 0 10px 10px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        z-index: 30;
    }

    /* The flap */
    .flap {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        border-left: 160px solid transparent;
        border-right: 160px solid transparent;
        border-top: 100px solid #f87171;
        transform-origin: top;
        transition: transform 0.8s ease;
        z-index: 50;
    }

    .open .flap {
        transform: rotateX(180deg);
        z-index: 10;
    }

    /* The Letter */
    .letter {
        position: absolute;
        top: 5px;
        left: 10px;
        width: 300px;
        background: white;
        padding: 40px 20px;
        text-align: center;
        z-index: 25;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
        /* The letter will move via JS scroll */
        transform: translateY(0px);
        min-height: 800px;
    }

    /* UI text hide transition */
    #main-ui {
        transition: all 1s ease;
    }
</style>
</head>

<body>

<!-- Update the src to your music/love.mp3 -->
<audio id="bgMusic" loop preload="auto">
    <source src="love.mp3" type="audio/mpeg">
    <source src="love.mp3" type="audio/mpeg">
</audio>

<div id="main-ui" class="fixed inset-0 flex flex-col items-center justify-center z-50 p-6">
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl p-10 max-w-sm w-full shadow-2xl text-center">
        <h1 class="text-5xl font-black text-red-900 mb-2" style="font-family:'Playfair Display';">
            Propose Day
        </h1>
        <p class="uppercase tracking-widest text-xs mb-6 text-red-700" style="font-family:'Cinzel';">
            February 8
        </p>

        <input id="nameInput" placeholder="Enter name..." 
            class="w-full py-3 px-4 rounded-xl text-center border-2 border-red-200 focus:border-red-600 outline-none mb-4 text-lg"/>

        <button onclick="unlock()" 
            class="w-full py-4 rounded-xl bg-red-800 text-white font-bold tracking-widest hover:bg-red-700 transition active:scale-95">
            OPEN
        </button>
    </div>
</div>

<div id="scroll-container" class="hidden">
    <!-- This div creates the scroll length -->
    <div style="height: 300vh;"></div> 

    <div id="env-wrapper" class="envelope-wrapper">
        <div id="flap" class="flap"></div>
        <div class="envelope"></div>
        
        <div id="letter" class="letter">
            <h2 class="text-3xl font-bold text-red-900 mb-10">Dearest Subina,</h2>
            <div class="space-y-20 text-lg text-red-800 italic font-serif">
                <p>Every heartbeat of mine whispers your name...</p>
                <p>Since the day we met, my world has been brighter.</p>
                <p>I may not be perfect, but my love for you is.</p>
                <p>I want to walk every path of life holding your hand.</p>
                <p class="text-3xl font-bold not-italic pt-20 text-red-900">Will you be mine? 💍</p>
                <div class="h-40"></div>
                <p class="text-sm opacity-50 font-sans">End of letter. Forever begins here.</p>
            </div>
        </div>
    </div>
</div>

<script>
// Generate Roses
const roseContainer = [];
for(let i=0; i<30; i++){
    const r = document.createElement('div');
    r.className = 'rose';
    r.textContent = '🌹';
    r.style.left = Math.random() * 100 + 'vw';
    r.style.fontSize = Math.random() * 20 + 20 + 'px';
    r.style.animationDuration = Math.random() * 5 + 5 + 's';
    document.body.appendChild(r);
    roseContainer.push(r);
}

function unlock() {
    const input = document.getElementById('nameInput').value.trim().toLowerCase();
    const music = document.getElementById('bgMusic');

    if(input === "subina") {
        // 1. Play Music Immediately
        music.play().catch(e => console.log("Audio Error:", e));

        // 2. Clear Roses Immediately
        roseContainer.forEach(r => {
            r.style.opacity = '0';
            setTimeout(() => r.remove(), 1000);
        });

        // 3. Hide UI
        document.getElementById('main-ui').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('main-ui').classList.add('hidden');
            
            // 4. Show Letter Container
            document.getElementById('scroll-container').classList.remove('hidden');
            
            // 5. Open Flap
            setTimeout(() => {
                document.getElementById('flap').parentElement.classList.add('open');
                // Enable Scrolling
                document.body.style.overflowY = "auto";
                document.documentElement.style.overflowY = "auto";
            }, 600);
        }, 1000);

    } else {
        alert("This is a private letter 🔒");
    }
}

// 6. Scroll Logic
window.addEventListener('scroll', () => {
    const letter = document.getElementById('letter');
    const scrollVal = window.scrollY;
    
    // As you scroll down, move the letter UP (- value)
    if(scrollVal > 0) {
        // 0.8 controls the speed. Higher = faster slide out
        letter.style.transform = `translateY(-${scrollVal * 0.8}px)`;
    } else {
        letter.style.transform = `translateY(0px)`;
    }
});
</script>

</body>
</html>
