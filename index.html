<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Teddy Day 🧸</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #2b1b3f, #12071d);
  overflow: hidden;
  color: white;
}

/* Floating teddies */
.teddy {
  position: absolute;
  font-size: 30px;
  animation: float 12s linear infinite;
  opacity: 0.7;
}
@keyframes float {
  from { transform: translateY(110vh) rotate(0deg); }
  to { transform: translateY(-10vh) rotate(360deg); }
}

/* Heartbeat */
.heartbeat {
  animation: beat 1.4s infinite;
}
@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen">

<!-- Background Music -->
<audio id="bgMusic" src="lovei.mp3" autoplay loop muted></audio>

<!-- Floating Teddies -->
<div id="teddyWrap"></div>

<!-- Main Card -->
<div class="relative z-10 bg-black/40 backdrop-blur-xl rounded-2xl p-8 text-center max-w-md shadow-2xl">
  <h1 class="text-4xl font-semibold mb-3">Happy Teddy Day 🧸</h1>

  <!-- Typing Message -->
  <p class="text-lg text-pink-200 mb-6">
    <span id="typingMessage"></span>
  </p>

  <div class="text-6xl heartbeat mb-4">🧸❤️</div>

  <button onclick="startLove()" 
    class="px-6 py-3 bg-pink-600 hover:bg-pink-700 rounded-full transition">
    Hug the Teddy 🤗
  </button>

  <p id="extraMessage" class="mt-6 text-pink-300 hidden text-sm">
    Subina, this teddy carries all my hugs for you 🧸💞
  </p>
</div>

<script>
// Floating teddies
for (let i = 0; i < 25; i++) {
  const t = document.createElement('div');
  t.className = 'teddy';
  t.innerText = '🧸';
  t.style.left = Math.random() * 100 + 'vw';
  t.style.animationDuration = (8 + Math.random() * 6) + 's';
  t.style.opacity = Math.random();
  document.getElementById('teddyWrap').appendChild(t);
}

// Typing animation
const message = "Hey Subina, if I could give you one thing today, it would be a teddy that hugs you whenever I can’t. Happy Teddy Day, my cute girlfriend 🧸❤️";
const typingElement = document.getElementById("typingMessage");
let index = 0;

function typeMessage() {
  if (index < message.length) {
    typingElement.innerHTML += message.charAt(index);
    index++;
    setTimeout(typeMessage, 45);
  }
}

window.addEventListener('load', typeMessage);

// Interaction
function startLove() {
  document.getElementById('extraMessage').classList.remove('hidden');

  const music = document.getElementById('bgMusic');
  music.muted = false;
  music.play();

  if (navigator.vibrate) {
    navigator.vibrate([200, 100, 200]);
  }
}
</script>

</body>
</html>
